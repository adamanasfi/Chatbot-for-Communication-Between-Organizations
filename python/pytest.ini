[pytest]
asyncio_mode = auto
testpaths = erv2/tests redcrossv2/tests civildefensev2/tests
# The system Python has ROS2 pytest plugins registered globally
# (launch_ros / launch_testing) that fail to import here and crash
# collection -- explicitly disable them rather than requiring
# PYTEST_DISABLE_PLUGIN_AUTOLOAD=1 on every invocation.
addopts = -p no:launch_ros -p no:launch_testing
